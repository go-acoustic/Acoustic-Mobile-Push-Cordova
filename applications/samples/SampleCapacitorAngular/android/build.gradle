// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// acoustic-mobile-push: version properties
allprojects {
    project.ext {
        // -PmobilePushVersion=<version> overrides the validated version (for example in an e2e run)
        mobilePushVersion = project.findProperty("mobilePushVersion") ?: "3.11.3"
        androidxLibVersion = "1.6.0"
        playServicesBaseVersion = "18.3.0"
        playServicesLocationVersion = "21.0.1"
        firebaseCoreVersion = "19.0.2"
        firebaseMessagingVersion = "22.0.0"
        securityCryptoVersion = "1.1.0"
    }
}

// acoustic-mobile-push: release resource check
subprojects {
    afterEvaluate {
        tasks.matching { it.name == 'verifyReleaseResources' }.configureEach { enabled = false }
    }
}
